# Every field used in resource templates must also be listed in the expandProps
# map in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
# <mod version>+<minecraft version>: the jar names follow from this, e.g.
# fabric-potions-belt-1.1.0+26.2.jar
version=1.1.0+26.2
group=com.scr0ols.potionsbelt
java_version=25

# Common
minecraft_version=26.2
mod_name=Potion's Belt
mod_author=Scr0ols
mod_id=potionsbelt
license=GPL-3.0-or-later
credits=
description=A wearable potion belt: a 27-slot container that only accepts potions. Hold right click to drink the first available potion, or press a number key (1-9) while drinking to pick a column.
minecraft_version_range=[26.2]
## Minecraft version used by the 'common' project, list at
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.156.0+26.2
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.21-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
